<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise</title>

    <link rel="stylesheet" href="BirthdayWishes.css">
</head>
<body>

<div class="container">

    <div id="question">
        <h2>Will you click me? 😊</h2>

        <div class="buttons">
            <button id="yes">Yes </button>
            <button id="no">No </button>
        </div>
    </div>

    <div id="celebration">

        <div class="name" id="name"></div>

        <div class="cake">
            <div class="candle">
                <div class="flame">
                    <div class="cake-container">
    <img id="cakeImg" src="WITHOUTbg.png" alt="Birthday Cake">
</div>
                </div>
            </div>

            <div class="base">
                <div class="cream"></div>
            </div>
        </div>

        <div class="quote">
            🎉 Happy Birthday! Stay Awesome! 🎉
        </div>

    </div>

</div>

<script src="BirthdayWishes.js"></script>

</body>
</html>
